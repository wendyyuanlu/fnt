mary\">Create explicit meal</button></form><p class=\"muted\">Only newly created headers get default totals, including an explicit end-of-table bound. Imported header formulas remain unchanged.</p></dialog>","actualWidth":650,"title":"Meal blocks"},{"id":"day","name":"Day blocks","width":650,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog aria-label=\"Day blocks\" open=\"\"><div class=\"dialog-heading\"><h2>Day blocks</h2><button class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\">x</button></div><p>A block runs from one header record to the next. Moving ingredients across a header still changes membership. Existing formulas are never silently repaired.</p><div class=\"menu\"><button id=\"group-top\">Group &amp; move to top</button><button id=\"select-block\">Select current block (1 records)</button><button id=\"move-block\">Move current block below table header</button><button id=\"collapse-block\">Group block details for collapse</button></div><hr><h3>New day header</h3><form id=\"new-block\"><label>Date<input id=\"block-label\" type=\"date\" required=\"\" value=\"\"></label><label>Status<select id=\"block-status\"><option selected=\"\">real</option><option>planned</option><option>hypothetical</option></select></label><button class=\"primary\">Create explicit day</button></form><p class=\"muted\">Only newly created headers get default totals, including an explicit end-of-table bound. Imported header formulas remain unchanged.</p></dialog>","actualWidth":650,"title":"Day blocks"},{"id":"file","name":"Workbook & recovery","width":650,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog aria-label=\"Workbook &amp; recovery\" open=\"\"><div class=\"dialog-heading\"><h2>Workbook &amp; recovery</h2><button class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\">x</button></div><p id=\"browser-workbook\" class=\"muted\">This browser profile at http://127.0.0.1:5173. Other browser profiles and preview ports have separate local workbooks. Ingredients: 3 records, 6 columns. No Excel source has been imported into this workbook. Choose Import Ingredients below to load your Excel data here.</p><div class=\"menu\"><button id=\"backup\" class=\"primary\">Download independent full backup</button><button>Export Excel projection + embedded Fnt archive</button><label>Import Ingredients into this workbook<input type=\"file\" id=\"import-ingredients\" accept=\".xlsx\" value=\"\"></label><label>Restore Fnt backup<input type=\"file\" id=\"restore\" accept=\".json\" value=\"\"></label><label>Recover embedded Fnt snapshot (ignores external Excel edits)<input type=\"file\" id=\"recover-xlsx\" accept=\".xlsx\" value=\"\"></label><label>Replace workbook from Excel (pre-import recovery)<input type=\"file\" id=\"import\" accept=\".xlsx\" value=\"\"></label><button id=\"history\">Recovery checkpoints</button><button id=\"sync\">Private GitHub sync</button><button id=\"privacy\">Storage &amp; privacy</button></div><p class=\"muted\">Ingredients import keeps existing records and other sheets, saves a full pre-import recovery archive, and disconnects sync. Backups contain your data; keep them private. XLSX compatibility is not certified.</p></dialog>","actualWidth":650,"title":"Workbook & recovery"},{"id":"recovery","name":"Recovery checkpoints","width":650,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog aria-label=\"Recovery checkpoints\" open=\"\"><div class=\"dialog-heading\"><h2>Recovery checkpoints</h2><button class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\">x</button></div><p>Restoring first saves a full pre-restore archive, retains pending edits and disconnects sync. Checkpoints share browser storage; they are not independent backups until downloaded.</p><div class=\"menu\"><p>No checkpoints yet. Use Save workbook to create one.</p></div></dialog>","actualWidth":650,"title":"Recovery checkpoints"},{"id":"sync","name":"Optional private GitHub sync","width":650,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog aria-label=\"Optional private GitHub sync\" open=\"\"><div class=\"dialog-heading\"><h2>Optional private GitHub sync</h2><button class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\">x</button></div><p>Opt-in only. This uploads workbook data to the private repository you choose. Never use your website source or a public repository. Existing remote files are not overwritten on conflict.</p><form id=\"sync-form\"><label>Personal repository owner<input id=\"sync-owner\" value=\"\" required=\"\" autocomplete=\"off\"></label><label>Private data repository<input id=\"sync-repo\" value=\"\" required=\"\"></label><label>Existing branch<input id=\"sync-branch\" value=\"main\" required=\"\"></label><label>JSON path<input id=\"sync-path\" value=\"workbook.json\" required=\"\"></label><label>Fine-grained token: Contents read/write, only this data repository<input id=\"sync-token\" type=\"password\" autocomplete=\"off\" required=\"\" value=\"\"></label><p class=\"muted\">Token stays in memory for this tab, never in backups or local storage. GitHub must already contain the branch. Sync is manual/batched with Save, not each keystroke. Large files may exceed the Contents API limit.</p><button class=\"primary\">Connect &amp; sync now</button><button id=\"disconnect\" type=\"button\">Disconnect</button></form></dialog>","actualWidth":650,"title":"Optional private GitHub sync"},{"id":"privacy","name":"Your data, deliberately local","width":650,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog aria-label=\"Your data, deliberately local\" open=\"\"><div class=\"dialog-heading\"><h2>Your data, deliberately local</h2><button class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\">x</button></div><p><b>Local autosave:</b> edits and their pending-operation IDs are committed together in IndexedDB. \"Saved\" appears only after the transaction completes. Save also creates a local checkpoint, or syncs if connected.</p><p><b>Independent backups matter:</b> browser data can be evicted, cleared, or lost with your device. Download full backups regularly. Recovery history on the same device is not a separate backup.</p><p><b>Nothing uploaded by default:</b> no analytics, hosted spreadsheet engine, account requirement, or bundled personal workbook. Optional GitHub sync verifies the repository is private before uploading. Conflicts preserve both versions instead of last-write-wins.</p><p><b>Review build:</b> not yet a certified replacement for Excel. Unsupported calculations display errors, not stale cached results. The original workbook remains authoritative. Text-based INDIRECT cannot follow source renames by definition.</p><p id=\"storage-info\">Browser storage: approximately 0.1 MB used of 10240 MB available.</p><button id=\"persist\">Request persistent browser storage</button></dialog>","actualWidth":650,"title":"Your data, deliberately local"},{"id":"new-dd","name":"New dropdown list or conversions","width":650,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog aria-label=\"New dropdown list or conversions\" open=\"\"><div class=\"dialog-heading\"><h2>New dropdown list or conversions</h2><button class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\">x</button></div><form><label>Name<input id=\"answer\" required=\"\" value=\"\"></label><label>Group (optional)<input id=\"reference-group\" placeholder=\"Leave empty for a s ok<input type=\"file\" id=\"import-ingredients\" accept=\".xlsx\" value=\"\"></label><label>Import Meals and link matching Ingredients<input type=\"file\" id=\"import-meals\" accept=\".xlsx\" value=\"\"></label><p class=\"muted\">Meals import adds a separate sheet, retains the previous Meals table as Meals_PreImport, preserves formulas and manual nutrition, and links ingredient labels to the first case-insensitive match from the top of Ingredients. Unmatched text stays manual. A full recovery copy is saved and sync is disconnected.</p><label>Restore Fnt backup<input type=\"file\" id=\"restore\" accept=\".json\" value=\"\"></label><label>Recover embedded Fnt snapshot (ignores external Excel edits)<input type=\"file\" id=\"recover-xlsx\" accept=\".xlsx\" value=\"\"></label><label>Replace workbook from Excel (pre-import recovery)<input type=\"file\" id=\"import\" accept=\".xlsx\" value=\"\"></label><button id=\"history\">Recovery checkpoints</button><button id=\"sync\">Private GitHub sync</button><button id=\"privacy\">Storage &amp; privacy</button></div><p class=\"muted\">Ingredients import keeps existing records and other sheets, saves a full pre-import recovery archive, and disconnects sync. Backups contain your data; keep them private. XLSX compatibility is not certified.</p></dialog>","actualWidth":600,"title":"Workbook & recovery"},{"id":"recovery","name":"Recovery checkpoints","width":600,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog class=\"dialog-surface\" aria-label=\"Recovery checkpoints\" open=\"\"><div class=\"dialog-heading\"><h1 class=\"dialog-title\">Recovery checkpoints</h1><button type=\"button\" class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\"><svg class=\"toolbar-icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M6 6l12 12M18 6 6 18\"></path></svg></button></div><p>Restoring first saves a full pre-restore archive, retains pending edits and disconnects sync. Checkpoints share browser storage; they are not independent backups until downloaded.</p><div class=\"menu\"><div><button data-checkpoint=\"0\">Before Move dropdown records into DD storage<small>2026-11-23T11:25:29.580Z</small></button><button data-recovery-backup=\"0\">Download full recovery archive</button></div></div></dialog>","actualWidth":600,"title":"Recovery checkpoints"},{"id":"sync","name":"Optional private GitHub sync","width":600,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog class=\"dialog-surface\" aria-label=\"Optional private GitHub sync\" open=\"\"><div class=\"dialog-heading\"><h1 class=\"dialog-title\">Optional private GitHub sync</h1><button type=\"button\" class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\"><svg class=\"toolbar-icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M6 6l12 12M18 6 6 18\"></path></svg></button></div><p>Opt-in only. This uploads workbook data to the private repository you choose. Never use your website source or a public repository. Existing remote files are not overwritten on conflict.</p><form id=\"sync-form\"><label>Personal repository owner<input id=\"sync-owner\" value=\"\" required=\"\" autocomplete=\"off\"></label><label>Private data repository<input id=\"sync-repo\" value=\"\" required=\"\"></label><label>Existing branch<input id=\"sync-branch\" value=\"main\" required=\"\"></label><label>JSON path<input id=\"sync-path\" value=\"workbook.json\" required=\"\"></label><label>Fine-grained token: Contents read/write, only this data repository<input id=\"sync-token\" type=\"password\" autocomplete=\"off\" required=\"\" value=\"\"></label><p class=\"muted\">Token stays in memory for this tab, never in backups or local storage. GitHub must already contain the branch. Sync is manual/batched with Save, not each keystroke. Large files may exceed the Contents API limit.</p><button class=\"primary\">Connect &amp; sync now</button><button id=\"disconnect\" type=\"button\">Disconnect</button></form></dialog>","actualWidth":600,"title":"Optional private GitHub sync"},{"id":"privacy","name":"Your data, deliberately local","width":600,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog class=\"dialog-surface\" aria-label=\"Your data, deliberately local\" open=\"\"><div class=\"dialog-heading\"><h1 class=\"dialog-title\">Your data, deliberately local</h1><button type=\"button\" class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\"><svg class=\"toolbar-icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M6 6l12 12M18 6 6 18\"></path></svg></button></div><p><b>Local autosave:</b> edits and their pending-operation IDs are committed together in IndexedDB. \"Saved\" appears only after the transaction completes. Save also creates a local checkpoint, or syncs if connected.</p><p><b>Independent backups matter:</b> browser data can be evicted, cleared, or lost with your device. Download full backups regularly. Recovery history on the same device is not a separate backup.</p><p><b>Nothing uploaded by default:</b> no analytics, hosted spreadsheet engine, account requirement, or bundled personal workbook. Optional GitHub sync verifies the repository is private before uploading. Conflicts preserve both versions instead of last-write-wins.</p><p><b>Review build:</b> not yet a certified replacement for Excel. Unsupported calculations display errors, not stale cached results. The original workbook remains authoritative. Text-based INDIRECT cannot follow source renames by definition.</p><p id=\"storage-info\">Browser storage: approximately 0.2 MB used of 10240 MB available.</p><button id=\"persist\">Request persistent browser storage</button></dialog>","actualWidth":600,"title":"Your data, deliberately local"},{"id":"new-dd","name":"New dropdown list or conversions","width":600,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog class=\"dialog-surface\" aria-label=\"New dropdown list or conversions\" open=\"\"><div class=\"dialog-heading\"><h1 class=\"dialog-title\">New dropdown list or conversions</h1><button type=\"button\" class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\"><svg class=\"toolbar-icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M6 6l12 12M18 6 6 18\"></path></svg></button></div><form><label>Name<input id=\"answer\" required=\"\" value=\"\"></label><label>Group (optional)<input id=\"reference-group\" placeholder=\"Leave empty for a standalone dropdown\" hidden=\"\" value=\"\"><button type=\"button\" class=\"reference-group-picker\" role=\"combobox\" aria-label=\"Group\" aria-haspopup=\"listbox\" aria-expanded=\"false\">Standalone<span class=\"format-caret\" aria-hidden=\"true\"></span></button></label><label>Contents<select id=\"reference-kind\"><option value=\"list\" selected=\"\">Editable dropdown options</option><option value=\"conversions\">Unit conversions</option><option value=\"de ,0));\"><span class=\"cell-value\" style=\"opacity:0.8;\">Hypo example</span></td><td class=\"hypothetical-cell \" style=\"--hyp-pattern:repeating-linear-gradient(135deg,rgba(119,119,119,0.07058823529411765) 0px,rgba(119,119,119,0.07058823529411765) 2px,transparent 2px,transparent 8px);--hyp-pattern-size:auto;--hyp-fill:linear-gradient(rgba(255,247,230,0),rgba(255,247,230,0));\"><span class=\"cell-value\" style=\"opacity:0.8;\">120</span></td></tr><tr><td class=\"hypothetical-cell selected\" style=\"--hyp-pattern:repeating-linear-gradient(135deg,rgba(119,119,119,0.07058823529411765) 0px,rgba(119,119,119,0.07058823529411765) 2px,transparent 2px,transparent 8px);--hyp-pattern-size:auto;--hyp-fill:linear-gradient(rgba(255,247,230,0),rgba(255,247,230,0));\"><span class=\"cell-value\" style=\"opacity:0.8;\">Hypo example</span></td><td class=\"hypothetical-cell selected\" style=\"--hyp-pattern:repeating-linear-gradient(135deg,rgba(119,119,119,0.07058823529411765) 0px,rgba(119,119,119,0.07058823529411765) 2px,transparent 2px,transparent 8px);--hyp-pattern-size:auto;--hyp-fill:linear-gradient(rgba(255,247,230,0),rgba(255,247,230,0));\"><span class=\"cell-value\" style=\"opacity:0.8;\">120</span></td></tr></tbody></table></div>\n    <div class=\"treatment-fields\">\n      <fieldset class=\"treatment-section\"><legend>Pattern</legend>\n        <label class=\"treatment-field\" for=\"hyp-pattern-trigger\">Pattern<select id=\"hyp-pattern\" hidden=\"\"><option value=\"none\">No pattern</option><option value=\"lines\" selected=\"\">Lines</option><option value=\"dots\">Dots</option><option value=\"crosshatch\">Crosshatch</option><option value=\"grid\">Grid</option><option value=\"checkerboard\">Checkerboard</option></select><button type=\"button\" id=\"hyp-pattern-trigger\" class=\"dropdown-field\" role=\"combobox\" aria-label=\"Pattern\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-controls=\"hyp-pattern-options\"><span>Lines</span><svg width=\"12\" height=\"12\" viewBox \" id=\"hyp-textColor\" disabled=\"\" value=\"#233c34\"></label>\n        <div class=\"treatment-control\"><label for=\"hyp-textOpacity\">Text opacity (%)</label><div><input id=\"hyp-textOpacity\" type=\"number\" min=\"0\" max=\"100\" step=\"1\" required=\"\" value=\"80\"><input type=\"range\" data-number=\"textOpacity\" min=\"0\" max=\"100\" step=\"1\" aria-label=\"Text opacity (%) slider\" value=\"80\"></div></div>\n        <div class=\"treatment-control\"><label>Emphasis</label><div class=\"treatment-emphasis\"><label class=\"inline\"><input type=\"checkbox\" id=\"hyp-bold\" title=\"Add bold without replacing existing cell formatting\" value=\"on\">Bold</label><label class=\"inline\"><input type=\"checkbox\" id=\"hyp-italic\" title=\"Add italic without replacing existing cell formatting\" value=\"on\">Italic</label><label class=\"inline\"><input type=\"checkbox\" id=\"hyp-underline\" title=\"Add underline without replacing existing cell formatting\" value=\"on\">Underline</label></div></div>\n      </fieldset>\n      <fieldset class=\"treatment-section\"><legend>Fill</legend>\n        <label class=\"treatment-color\">Fill color<input type=\"color\" id=\"hyp-fillColor\" value=\"#fff7e6\"></label>\n        <div class=\"treatment-control\"><label for=\"hyp-fillOpacity\">Fill opacity (%)</label><div><input id=\"hyp-fillOpacity\" type=\"number\" min=\"0\" max=\"100\" step=\"1\" required=\"\" value=\"0\"><input type=\"range\" data-number=\"fillOpacity\" min=\"0\" max=\"100\" step=\"1\" aria-label=\"Fill opacity (%) slider\" value=\"0\"></div></div>\n      </fieldset>\n      <fieldset class=\"treatment-section\"><legend>Badge</legend>\n        <label class=\"inline\"><input type=\"checkbox\" id=\"hyp-badge\" value=\"on\">Show badge <svg class=\"toolbar-icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M4 4h5v6h6V4h5v16h-5v-6H9v6H4Z\"></path></svg></label>\n        <div class=\"treatment-badge-colors\" hidden=\"\"><label class=\"treatment-color\">Badge ink<input type=\"color\" id=\"hyp-badgeColor\" value=\"#785a30\"></label><label class=\"treatment-color\">Badge fill<input type=\"color\" id=\"hyp-badgeBackground\" value=\"#fff7e6\"></label><label class=\"treatment-color\">Badge border<input type=\"color\" id=\"hyp-badgeBorder\" value=\"#98764e\"></label>\n          <label class=\"treatment-field\" for=\"hyp-badgeBorderStyle-trigger\">Border<select id=\"hyp-badgeBorderStyle\" hidden=\"\"><option value=\"solid\" selected=\"\">Solid</option><option value=\"dashed\">Dashed</option></select><button type=\"button\" id=\"hyp-badgeBorderStyle-trigger\" class=\"dropdown-field\" role=\"combobox\" aria-label=\"Border\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-controls=\"hyp-badgeBorderStyle-options\"><span>Solid</span><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"><path vector-effect=\"non-scaling-stroke\" d=\"m3 4 3 3 3-3\"></path></svg></button></label>\n          <div class=\"treatment-control\"><label for=\"hyp-badgeDashSize\">Dash size (px)</label><div><input id=\"hyp-badgeDashSize\" type=\"number\" min=\"0.5\" max=\"12\" step=\"0.5\" required=\"\" disabled=\"\" value=\"3\"><input type=\"range\" data-number=\"badgeDashSize\" min=\"0.5\" max=\"12\" step=\"0.5\" aria-label=\"Dash size (px) slider\" disabled=\"\" value=\"3\"></div></div><div class=\"treatment-control\"><label for=\"hyp-badgeDashGap\">Dash gap (px)</label><div><input id=\"hyp-badgeDashGap\" type=\"number\" min=\"0.5\" max=\"12\" step=\"0.5\" required=\"\" disabled=\"\" value=\"2\"><input type=\"range\" data-number=\"badgeDashGap\" min=\"0.5\" max=\"12\" step=\"0.5\" aria-label=\"Dash gap (px) slider\" disabled=\"\" value=\"2\"></div></div>\n        </div>\n      </fieldset>\n    </div>\n    <label class=\"treatment-name\">Display name<input id=\"hyp-label\" required=\"\" maxlength=\"40\" placeholder=\"Hypo, Planned or Draft\" value=\"Hypo\"></label>\n    <p class=\"treatment-error error\" role=\"alert\" hidden=\"\"></p>\n    <div class=\"button-row treatment-footer\"><button class=\"primary\" type=\"submit\">Save</button><button id=\"hyp-cancel\" type=\"button\">Cancel</button></div>\n  </form></dialog>","actualWidth":600,"title":"Hypo styling"},{"id":"rename-workbook","name":"Rename workbook","width":600,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog class=\"dialog-surface\" aria-label=\"Rename workbook\" open=\"\"><div class=\"dialog-heading\"><h1 class=\"dialog-title\">Rename workbook</h1><button type=\"button\" class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\"><svg class=\"toolbar-icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M6 6l12 12M18 6 6 18\"></path></svg></button></div><form id=\"ask-form\"><label>Name<input id=\"answer\" required=\"\" value=\"My nutrition workbook\"></label><button class=\"primary\">Apply</button></form></dialog>","actualWidth":600,"title":"Rename workbook"},{"id":"rename-sheet","name":"Rename sheet","width":600,"note":"Captured from the real local UI with synthetic demo data","html":"<dialog class=\"dialog-surface\" aria-label=\"Rename sheet\" open=\"\"><div class=\"dialog-heading\"><h1 class=\"dialog-title\">Rename sheet</h1><button type=\"button\" class=\"close\" aria-label=\"Close dialog\" data-shortcut-label=\"Close dialog\" data-shortcut-keys=\"Esc\" aria-keyshortcuts=\"Escape\"><svg class=\"toolbar-icon\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable <script>
const revisions=window.DIALOG_GALLERY.revisions??[window.DIALOG_GALLERY],names=document.querySelector('#names'),frame=document.querySelector('#preview'),stage=document.querySelector('.stage'),screen=document.querySelector('.screen');
const entrypoints=window.DIALOG_GALLERY.entrypoints??{};
function badge(){const el=document.createElement('span');el.className='na-badge';el.textContent='N/A';el.title='No current site entry point';return el;}
let revision=revisions.length-1,data=revisions[revision].snapshots,current,viewport='desktop';
function fit(){
 const available=Math.max(1,stage.clientWidth-20),width=viewport==='desktop'?available:Math.min(390,available),height=Math.max(1,stage.clientHeight-20);
 frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='none';screen.style.width=width+2+'px';screen.style.height=height+2+'px';
 if(current)document.querySelector('#dimensions').textContent=current.width+'px width family; '+width+'px available viewport at 100% zoom. Wider dialogs adapt to this space.';
}
function preview(item){
 if(current?.id===item.id)return;current=item;
 document.querySelectorAll('.entry').forEach(button=>button.setAttribute('aria-current',String(button.dataset.id===item.id)));
 document.querySelector('#name').textContent=item.name;document.querySelector('#source').textContent=item.note;
 const entry=entrypoints[item.id],where=document.querySelector('#entrypoint');where.replaceChildren();
 if(entry?.[0])where.textContent='Open: '+entry[0];else{where.append(badge(),document.createTextNode(' '+(entry?.[1]??'Entry point not documented.')));document.querySelector('#name').append(badge());}
 frame.title=item.name+' - read-only preview';
 const css='body{margin:0!important;display:block!important;overflow:auto!important;background:#e8ede2!important;height:100vh!important;padding:0!important}dialog[open],.group-manager{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;margin:var(--dialog-edge,20px) auto!important;max-height:calc(100vh - var(--dialog-gutter,40px))!important;pointer-events:none!important}.group-manager{display:block!important}.color-picker{max-width:calc(100vw - var(--dialog-gutter,16px))!important}';
 frame.srcdoc='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+revisions[revision].styles+'</style><style>'+css+'</style></head><body>'+item.html+'</body></html>';
 fit();
}
function draw(){
 names.replaceChildren();let family;
 const query=document.querySelector('#search').value.toLowerCase(),items=data.filter(item=>(item.name+' '+item.width+' '+(entrypoints[item.id]?.join(' ')??'')+(!entrypoints[item.id]?.[0]?' N/A':'')).toLowerCase().includes(query)).sort((a,b)=>a.width-b.width||a.name.localeCompare(b.name));
 for(const item of items){
  if(family!==item.width){family=item.width;const h=document.createElement('div');h.className='family';h.textContent=family+'px'+([1100,1950].includes(family)?' maximum':'');names.append(h);}
  const button=document.createElement('button');button.type='button';button.className='entry';button.dataset.id=item.id;button.setAttribute('aria-current',String(current?.id===item.id));
  const text=document.createElement('span');text.textContent=item.name;const size=document.createElement('small');size.textContent=item.width+'px';const detail=document.createElement('span');detail.className='entry-details';if(!entrypoints[item.id]?.[0])detail.append(badge());detail.append(size);button.append(text,detail);button.title=entrypoints[item.id]?.[0]??entrypoints[item.id]?.[1]??'';
  button.addEventListener('pointerenter',()=>preview(item));button.addEventListener('focus',()=>preview(item));button.addEventListener('click',()=>preview(item));names.append(button);
 }
 if(!items.length){const message=document.createElement('p');message.id='empty';message.textContent='No matching dialogs';names.append(message);}
}
document.querySelector('#search').addEventListener('input',draw);
document.querySelectorAll('[data-viewport]').forEach(button=>button.onclick=()=>{viewport=button.dataset.viewport;document.querySelectorAll('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));fit();});
function showRevision(index){
 const id=current?.id;revision=index;data=revisions[revision].snapshots;current=undefined;
 document.querySelector('#prev').disabled=revision===0;document.querySelector('#next').disabled=revision===revisions.length-1;
 document.querySelector('#revision').textContent='Audit '+(revision+1)+' of '+revisions.length+' — '+revisions[revision].label+(revision===revisions.length-1?' (latest)':'');
 draw();preview(data.find(item=>item.id===(id??'tables'))??data[0]);
}
document.querySelector('#prev').onclick=()=>showRevision(revision-1);document.querySelector('#next').onclick=()=>showRevision(revision+1);
new ResizeObserver(fit).observe(stage);showRevision(revision);
</script>
