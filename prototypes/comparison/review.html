<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fnt - Responsive comparison review</title>
  <link rel="stylesheet" href="./review.css">
</head>
<body class="compact-controls">
  <header>
    <b>Responsive preview</b>
    <span id="viewport-size" role="status">Full width</span>
    <div class="review-modes" role="group" aria-label="Full-interface button styles"><span>Button styles</span><button class="navigation-choice" data-control-style="before" type="button" aria-pressed="false" aria-controls="comparison-frame">Before</button><button class="navigation-choice" data-control-style="after" type="button" aria-pressed="true" aria-controls="comparison-frame">After</button></div>
    <div class="review-modes" role="group" aria-label="Dropdown menu option styles"><span>Menu options</span><button class="navigation-choice" data-dropdown-style="previous" type="button" aria-pressed="false" aria-controls="comparison-frame">Previous</button><button class="navigation-choice" data-dropdown-style="dd" type="button" aria-pressed="true" aria-controls="comparison-frame">DD picker</button></div>
    <button id="mobile-mode" type="button" aria-pressed="false" aria-controls="comparison-frame">Mobile mode</button>
    <small class="review-note">Before shows original control styling on the current full UI. These switches retain your choices; neither version changes workbook data.</small>
  </header>
  <main>
    <iframe id="comparison-frame" src="./index.html" title="Comparison prototype viewport"></iframe>
  </main>
  <script type="module" src="./review.ts"></script>
</body>
</html>
