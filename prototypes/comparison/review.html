<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fnt - Responsive comparison review</title>
  <link rel="stylesheet" href="./review.css">
</head>
<body class="compact-controls">
  <header>
    <b>Responsive preview</b>
    <span id="viewport-size" role="status">Full width</span>
    <div class="review-modes" role="group" aria-label="Change filter design"><span>Change filters</span><button class="navigation-choice" data-filter-design="tabs" type="button" aria-pressed="true" aria-controls="comparison-frame">Tabs</button><button class="navigation-choice" data-filter-design="dropdown" type="button" aria-pressed="false" aria-controls="comparison-frame">Dropdown</button></div>
    <button id="mobile-mode" type="button" aria-pressed="false" aria-controls="comparison-frame">Mobile mode</button>
    <small class="review-note">Compare category tabs with one grouped dropdown on the full UI. Switching retains filters and choices; neither design changes workbook data.</small>
  </header>
  <main>
    <iframe id="comparison-frame" src="./index.html" title="Comparison prototype viewport"></iframe>
  </main>
  <script type="module" src="./review.ts"></script>
</body>
</html>
